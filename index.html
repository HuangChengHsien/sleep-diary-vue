<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F0" />
    <script>
      // 首屏前決定主題，避免半夜打開先閃一整面亮色。邏輯與 src/lib/theme.js 一致，色碼＝tokens.css 的 --bg。
      ;(function () {
        var pref = 'system'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#14100C' : '#FAF7F0')
      })()
    </script>
    <meta name="description" content="眠手帳：免登入的兒童青少年睡眠日誌。記錄與分析睡眠作息，資料只存在本機裝置。" />
    <!-- 社群分享預覽（LINE、Facebook、Threads、X）。圖片原稿在 docs/design/og-image.html；網址必須是完整網址 -->

    <meta property="og:title" content="眠手帳｜免登入的兒童青少年睡眠日誌" />
    <meta property="og:description" content="不用註冊，資料只存在自己手機。記錄孩子的上床、入睡、起床與夜醒，整理成可列印的報告帶去門診。" />
    <meta property="og:url" content="https://diary.kidnsleep.com/" />
    <meta property="og:image" content="https://diary.kidnsleep.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="眠手帳：免登入的兒童青少年睡眠日誌" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>眠手帳</title>
  </head>
